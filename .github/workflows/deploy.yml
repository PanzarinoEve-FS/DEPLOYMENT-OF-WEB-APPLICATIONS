# Builds the Jekyll site at the root of the repo, builds the React app in
# app/ with Vite and adds it to the site under /app/, then publishes the
# result to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you run the deployment by hand from the Actions tab.
  workflow_dispatch:

# Permissions the GITHUB_TOKEN needs to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a deployment that has started finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          # Runs `bundle install` from Gemfile.lock and caches the gems.
          bundler-cache: true

      - name: Build Jekyll site
        # base_path is /DEPLOYMENT-OF-WEB-APPLICATIONS, the sub-path Pages
        # serves this repo from, so the theme's CSS and links resolve.
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install React app dependencies
        working-directory: app
        run: npm ci

      - name: Build React app with Vite
        working-directory: app
        run: npm run build

      # Runs after the Jekyll build because Jekyll empties _site/ first.
      - name: Add React app to the site under /app/
        run: cp -R app/dist _site/app

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
