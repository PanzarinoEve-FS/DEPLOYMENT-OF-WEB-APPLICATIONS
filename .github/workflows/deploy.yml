# Builds the Jekyll site in jekyll/ for the root of the site, builds the
# Next.js site at the repo root as a static export and adds it under /app/,
# then publishes the result to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you run the deployment by hand from the Actions tab.
  workflow_dispatch:

# Permissions the GITHUB_TOKEN needs to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a deployment that has started finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          # Runs `bundle install` from jekyll/Gemfile.lock and caches the gems.
          bundler-cache: true
          working-directory: jekyll

      - name: Build Jekyll site
        working-directory: jekyll
        # base_path is the sub-path Pages serves this repo from (the repo
        # name, e.g. /Deployment-of-Web-Applications), so the theme's CSS and
        # links resolve.
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Next.js dependencies
        run: npm ci

      - name: Build Next.js site
        run: npm run build
        env:
          # next.config.ts adds /app to this, so the site follows the repo
          # name even if the repo is renamed.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Runs after the Jekyll build because Jekyll empties jekyll/_site/ first.
      - name: Add Next.js site under /app/
        run: cp -R out jekyll/_site/app

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: jekyll/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
