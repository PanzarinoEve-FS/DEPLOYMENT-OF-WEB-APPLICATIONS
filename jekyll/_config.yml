# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Deployment of Web Applications
author: Eve Panzarino
# Shown in the footer under the author's name, after a "#". Keep the quotes
# so YAML keeps the leading zeros.
student_number: "0004828216"
email: jnhankins@student.fullsail.edu
# Shown in the footer under the email address, one per line.
school_lines:
  - Full Sail University
  - Web Development Bachelors
# Shown in the footer under the school lines.
course_dates: "Nov 23rd, 2026 - Dec 20th, 2026"
# Used in the page's <title> and search-result description, and in feed.xml.
description: Full Sail University - Web Development Bachelors
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
github_username: PanzarinoEve-FS
# Shown above the footer's GitHub links.
github_username_heading: "Student Github:"

# More GitHub links for the footer, shown under github_username, each with
# an optional heading above it.
# (_includes/social.html adds these; minima itself shows only one.)
github_links:
  - heading: "Main Github:"
    label: EvePanzarino
    url: https://github.com/evepanzarino

# The footer's third column (_includes/footer.html): each footer line on its
# own line, then the course modules. A module with a url is a link, and one
# without is plain text. A url can be a path on this site, like /app/, or a
# full https:// address.
footer_lines:
  - "Module Directory:"
course_modules:
  - title: Module 1
    url: /module-1/
  - title: Module 2
    url: /module-2/
  - title: Module 3
    url: /module-3/
  - title: Module 4
    url: /module-4/

# Pages listed in the top menu. Without this, minima lists every page that
# has a title, which would add the module pages too.
header_pages:
  - about.markdown

# Build settings
theme: minima
plugins:
  - jekyll-feed
# The module posts are dated by the week each module starts. Build posts
# dated after today too, so all four show now instead of on their dates.
future: true

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# The deploy workflow builds the Next.js site (at the repo root) separately
# and adds it to the finished site under /app/, so don't give any Jekyll
# page that path.
